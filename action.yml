name: Upload UI Evidence
description: Upload screenshots, videos, reports, traces, and logs to a UI Evidence Portal.
author: mtzack-org

branding:
  icon: image
  color: blue

inputs:
  portal-url:
    description: Base URL of the UI Evidence Portal.
    required: true
  token:
    description: Evidence ingest token configured on the Portal.
    required: true
  vercel-protection-bypass:
    description: Optional Vercel Automation Bypass secret for protected Preview deployments.
    required: false
  platform:
    description: Platform associated with the evidence (web, android, or ios).
    required: false
    default: web
  screenshots:
    description: Newline-separated glob patterns for screenshots.
    required: false
  videos:
    description: Newline-separated glob patterns for MP4 or WebM recordings.
    required: false
  reports:
    description: Newline-separated glob patterns for HTML or ZIP reports.
    required: false
  traces:
    description: Newline-separated glob patterns for trace files.
    required: false
  logs:
    description: Newline-separated glob patterns for log, text, or JSON files.
    required: false
  if-no-files-found:
    description: Behavior when no evidence matches (error, warn, or ignore).
    required: false
    default: warn
  status:
    description: Test result (success, failure, cancelled, passed, or failed).
    required: false
    default: success
  retention:
    description: Evidence retention class (normal, release, or manual).
    required: false
    default: normal
  total:
    description: Total number of tests for this platform.
    required: false
    default: "0"
  passed:
    description: Number of passed tests for this platform.
    required: false
    default: "0"
  failed:
    description: Number of failed tests for this platform.
    required: false
    default: "0"
  skipped:
    description: Number of skipped tests for this platform.
    required: false
    default: "0"
  duration-ms:
    description: Test duration in milliseconds.
    required: false
    default: "0"

outputs:
  run-id:
    description: Portal run identifier.
  run-url:
    description: URL of the uploaded run in the Portal.
  uploaded-count:
    description: Number of uploaded evidence files.

runs:
  using: node24
  main: action/dist/index.mjs
